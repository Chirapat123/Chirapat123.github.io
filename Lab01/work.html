function putPixel(x,y,r,g,b,a=255){
    const idx = (y*canvas.width+x)*4;
    pixels[idx] = r;
    pixels[idx+1] =g;
    pixels[idx+2] =b;
    pixels[idx+3] =a;
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}


 function drawRect(x1, y1, x2, y2, r, g, b, a = 255) {
            drawLine(x1, y1, x2, y1, r, g, b, a)
            drawLine(x2, y1, x2, y2, r, g, b, a)
            drawLine(x2, y2, x1, y2, r, g, b, a)
            drawLine(x1, y1, x1, y2, r, g, b, a)
        }

function drawRectFilled(x1, y1, x2, y2, r, g, b, a = 255) {
            for (let y = y1; y < y2; y++) {
                for (let x = x1; x < x2; x++) {
                    putPixel(x, y, r, g, b, a)
                }

            }
        }

function drawRectGradient(x1,y1,x2,y2, r1,g1,b1, r2,g2,b2, a = 255){
    for(let y = y1; y <= y2; y++){
        let t = (y-y1) / (y2-y1)
        let r = Math.round(r1*(1-t)+r2*t)
        let g = Math.round(g1*(1-t)+g2*t)
        let b = Math.round(b1*(1-t)+b2*t)
        for(let x = x1; x <=x2;x++){
            putPixel(x,y,r,g,b,a)
        }
    }
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
    for (let y = -ry; y <= ry; y++) {
        for (let x = -rx; x <= rx; x++) {
            if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) {
                putPixel(cx + x, cy + y, r, g, b, a);
            }
        }
    }
}

function drawSprite(sprite,x,y,r,g,b,a=255) {
    for  (let j = 0; j < sprite.length;j++) {
        for(let i = 0; i< sprite[j].length; i++){
            if (sprite[j][i] === 1){
                putPixel(x+i,y+j,r,g,b,a)
            }
        }
    
    }
}

        }
    }
}

function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

canvas.addEventListener('click', function (event) {
    const { x ,y } = toScaledMouseCoords(event.clientX, event.clientY)
    //console.log('clicked', x, y);
    // putPixel(x,y,255,0,0);
    ctx.putImageData(imageData,0,0)
})

canvas.addEventListener('mousedown', function (event) {
    const { x ,y } = toScaledMouseCoords(event.clientX, event.clientY)
    isDragging = true;
    //console.log('mouseDOWN', x, y);
    // putPixel(x,y,0,255,0);
    if(bt) {
        drawRect(x,y,x+scaled,y*+scaled,r,g,b)
    }else {
    ctx.putImageData(imageData,0,0)
    }
})

canvas.addEventListener('mouseup', function (event) {
    const { x ,y } = toScaledMouseCoords(event.clientX, event.clientY)
    isDragging = false;
    //console.log('mouseUP', x, y);
    // putPixel(x,y,0,0,255);

    ctx.putImageData(imageData,0,0)
})

canvas.addEventListener('mousemove', function (event) {
    const { x ,y } = toScaledMouseCoords(event.clientX, event.clientY)
    mouseX = x;
    mouseY = y;
    if(isDragging) {
    //console.log('mouseMOVE', x, y);
    if(e) {
        drawRect(prvemouseX,prvemouseY,x,y,r,g,b)
    } else {
    drawLine(prvemouseX,prvemouseY,x,y,r,g,b)
    }
    }
    ctx.putImageData(imageData,0,0)
    prvemouseX = x;
    prvemouseY = y;
})

function drawSpriteRotate(sprite,x,y,degree,scaled,r,g,b,a=255) {
    const row = sprite.length /2
    const cot = sprite.length /2
    for  (let j = 0; j < sprite.length;j++) {
        for(let i = 0; i< sprite[j].length; i++){
            if (sprite[j][i] === 1){
                const rad = degree * (Math.PI/180)
                const x_rot = Math.round((i-row) * Math.cos(rad) - (j-cot) * Math.sin(rad)) 
                const y_rot = Math.round((i-row) * Math.sin(rad) + (j-cot) * Math.cos(rad)) 

                const x_scaled = Math.round(x_rot * scaled)
                const y_scaled = Math.round(y_rot * scaled)

                const x_translated = x_scaled + x
                const y_translated = y_scaled + y

                for  (let j = 0; j < scaled ;j++) {
                    for(let i = 0; i< scaled; i++){
                putPixel(x_translated+i,y_translated+j,r,g,b,a)
                }}
            }
        }
    
    }
}

function drawSprite24Bit(sprite, x, y) {
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      const color = sprite[j][i];

      if (color !== null) {
        const r = (color >> 16) & 255;
        const g = (color >> 8) & 255;
        const b = color & 255;
        putPixel(x + i, y + j, r, g, b);
      }
    }
  }
}
