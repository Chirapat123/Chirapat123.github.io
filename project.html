<!doctype html>
<html>
  <head>
    <title>Animations</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true; // Shadow
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 2, -10);
      camera.lookAt(0, 0, -0);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);

      const abmientLight = new THREE.AmbientLight(0x404040, 1); // soft white light
      scene.add(abmientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.set(10, 10, 10);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      const exrSkyboxUrl =
        "https://chirapat123.github.io/qwantani_dusk_2_puresky_1k.exr";
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      new THREE.EXRLoader().setDataType(THREE.UnsignedByteType).load(
        exrSkyboxUrl,
        (texture) => {
          const skybox = pmremGenerator.fromEquirectangular(texture).texture;
          scene.background = skybox;
          scene.environment = skybox;

          texture.dispose();
          pmremGenerator.dispose();
        },
        undefined,
        (error) => {
          console.error("Unable to load EXR skybox:", error);
        },
      );

      //load glb และใช้ pbr material
      const clock = new THREE.Clock();
      let mixer;
      const loader = new THREE.GLTFLoader();

      // ---------- ส่วน picking ----------
      const pickables = [];
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      // สถานะการซูม
      const defaultCamPos = camera.position.clone();
      const defaultTarget = controls.target.clone();
      let goalCamPos = null; // ตำแหน่งกล้องปลายทาง
      let goalTarget = null; // จุดที่กล้องมองปลายทาง

      loader.load("https://chirapat123.github.io/SwordNew.glb", (gltf) => {
        const model = gltf.scene;
        model.position.set(-8, -10, 30);
        model.scale.set(3, 3, 3);
        scene.add(model);

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            // [แก้] กดได้เฉพาะ mesh ที่ material มี texture (รูป)
            if (child.material && child.material.map) pickables.push(child);
          }
        });

        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          mixer.clipAction(clip).play();
        });
      });

      renderer.domElement.addEventListener("click", onPick);

      function onPick(e) {
        const r = renderer.domElement.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        pointer.x = (x / r.width) * 2 - 1;
        pointer.y = -(y / r.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(pickables, false)[0];

        if (!hit) {
          // กดที่ว่าง = กลับมุมมองเดิม
          goalCamPos = defaultCamPos.clone();
          goalTarget = defaultTarget.clone();
          return;
        }

        console.log("Picked:", hit.object.name, hit.object);
        zoomTo(hit); // [แก้] ส่ง hit ทั้งก้อน เพื่อใช้ normal ของหน้ารูป
      }

      function zoomTo(hit) {
        const object = hit.object;

        // หาจุดกึ่งกลางและขนาดในพิกัดโลก
        const box = new THREE.Box3().setFromObject(object);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        // ระยะกล้องให้พอดีกับขนาดวัตถุ
        const maxSize = Math.max(size.x, size.y, size.z);
        const fov = THREE.MathUtils.degToRad(camera.fov);
        const distance = (maxSize / 2 / Math.tan(fov / 2)) * 1.5;

        // [แก้] ให้กล้องไปอยู่หน้ารูป ตามทิศ normal ของหน้ารูป
        const dir = hit.face.normal
          .clone()
          .transformDirection(object.matrixWorld)
          .normalize();
        if (dir.dot(camera.position.clone().sub(center)) < 0) dir.negate();

        goalTarget = center;
        goalCamPos = center.clone().add(dir.multiplyScalar(distance));
      }

      function animate(t) {
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        // ค่อย ๆ เลื่อนกล้องไปหาเป้าหมาย
        if (goalCamPos && goalTarget) {
          camera.position.lerp(goalCamPos, 0.08);
          controls.target.lerp(goalTarget, 0.08);

          if (camera.position.distanceTo(goalCamPos) < 0.01) {
            goalCamPos = null; // ถึงแล้ว ปล่อยให้ผู้ใช้หมุนกล้องต่อได้
            goalTarget = null;
          }
        }

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate(0);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
