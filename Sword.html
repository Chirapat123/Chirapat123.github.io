<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #lightControl {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 250px;
    padding: 15px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    font-family: Arial, sans-serif;
    border-radius: 10px;
    z-index: 100;
}

#lightControl h3 {
    margin-top: 0;
}

#lightControl label {
    display: block;
    margin-top: 12px;
}

#lightControl input {
    width: 100%;
}
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);




        const exrSkyboxUrl = 'https://raw.githubusercontent.com/Chirapat123/Chirapat123.github.io/main/autumn_field_4k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });


        const geom = new THREE.BufferGeometry();
        //geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        //geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        //geom.computeVertexNormals();

        const tex = new THREE.TextureLoader().load('://sibsanhttpssuk.github.io/5241_Capheny2.png', t => {
        });
        const mat = new THREE.MeshStandardMaterial({
            map: tex
        });

        const mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);





        //load glb และใช้ pbr material
        const loader = new THREE.GLTFLoader();
        loader.load('https://chirapat123.github.io/Sword.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.scale.set(1,1,1)
            model.position.set(0, 0, 0);
            scene.add(model);
        });




        function animate(t) {
            mesh.rotation.y = Math.sin(t * 0.001);
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
